
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fasterp
      POSTGRES_USER: fasterp
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}"
      FASTERP_APP_PASSWORD: "${FASTERP_APP_PASSWORD:?define FASTERP_APP_PASSWORD en .env}"
    ports:
      - "5456:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea el rol sin privilegios con el que se conecta la app (solo en el primer
      # arranque, cuando el volumen se inicializa).
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fasterp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "7071:7071"
    environment:
      FASTERP_PORT: "7071"
      # Se conecta con el rol restringido, no con el superusuario de la base.
      FASTERP_DATABASE_URL: "postgres://fasterp_app:${FASTERP_APP_PASSWORD:?define FASTERP_APP_PASSWORD en .env}@postgres:5432/fasterp?sslmode=disable"
      # Sin valor por defecto a propósito: un secreto por defecto publicado en el repo
      # permite forjar tokens de admin sin credenciales.
      FASTERP_JWT_SECRET: "${FASTERP_JWT_SECRET:?define FASTERP_JWT_SECRET en .env}"
      FASTERP_JWT_REFRESH_SECRET: "${FASTERP_JWT_REFRESH_SECRET:?define FASTERP_JWT_REFRESH_SECRET en .env}"
      FASTERP_MODULES_DIR: "/app/modules"
      FASTERP_UPLOAD_DIR: "/app/uploads"
      FASTERP_CORS_ORIGINS: "${FASTERP_CORS_ORIGINS:?define FASTERP_CORS_ORIGINS con el dominio real}"
      FASTERP_RATE_LIMIT: "${FASTERP_RATE_LIMIT:-100}"
      FASTERP_AUTH_RATE_LIMIT: "${FASTERP_AUTH_RATE_LIMIT:-10}"
      FASTERP_DB_MAX_OPEN: "${FASTERP_DB_MAX_OPEN:-50}"
      FASTERP_DB_MAX_IDLE: "${FASTERP_DB_MAX_IDLE:-10}"
    volumes:
      - ./modules:/app/modules
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
