version: '3.9'

# Este archivo inicia Odoo + PostgreSQL para desarrollo/testing
# Uso: docker-compose -f docker-compose.odoo.yml up

services:
  # PostgreSQL para Odoo
  odoo-db:
    image: postgres:15-alpine
    container_name: odoo-postgres
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo123
    ports:
      - "5433:5432"  # Puerto diferente al de FastERP
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Odoo Community Edition v16
  odoo:
    image: odoo:16-latest
    container_name: odoo-server
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      PORT: 5432
      USER: odoo
      PASSWORD: odoo123
    ports:
      - "8069:8069"  # Web interface
      - "8072:8072"  # Chat/WebSocket
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo-config:/etc/odoo
    command: odoo --load=web --addons-path=/mnt/extra-addons
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  odoo-db-data:
  odoo-data:

networks:
  default:
    name: solar-network
