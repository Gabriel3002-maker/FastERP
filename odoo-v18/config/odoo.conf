[options]
# Odoo v18 Configuration File

# Database Configuration
db_host = odoo-v18-db
db_port = 5432
db_user = odoo
db_password = odoo123
# db_name se deja vacío para poder crear la base desde el asistente web
# db_name = odoo18

# Admin Password
admin_passwd = admin

# Network Configuration
listen_addresses = 0.0.0.0
xmlrpc_port = 8069

# File Storage
data_dir = /var/lib/odoo

# Logging
log_level = info
logfile = None

# Security
secure_cookie = False

# Performance
workers = 4
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 60
limit_time_real = 120

# Mail
smtp_server = localhost
smtp_port = 25
email_from = odoo@fasterp.local

# Addons
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

# Demo Data
without_demo = False

# Auto Reload
auto_reload = False

# CSV Import
csv_import = True

# Timezone
timezone = False
