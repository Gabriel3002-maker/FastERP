<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FastERP</title>

  <!-- Theme application ANTES de cargar CSS para evitar flash -->
  <script>
    (function() {
      const LIGHT = 'light';
      const DARK = 'dark';
      const AUTO = 'auto';
      const theme = localStorage.getItem('fasterp-theme') || AUTO;
      const html = document.documentElement;

      function applyTheme(t) {
        if (t === DARK) {
          html.style.colorScheme = 'dark';
          html.style.setProperty('--primary', '#579DFF');
          html.style.setProperty('--primary-hover', '#85B8FF');
          html.style.setProperty('--bg-primary', '#161A1D');
          html.style.setProperty('--bg-secondary', '#22272B');
          html.style.setProperty('--text-primary', '#B6C2CF');
          html.style.setProperty('--text-secondary', '#8590A2');
          html.style.setProperty('--border', '#38414B');
        } else if (t === LIGHT) {
          html.style.colorScheme = 'light';
          html.style.setProperty('--primary', '#0052CC');
          html.style.setProperty('--primary-hover', '#003DA8');
          html.style.setProperty('--bg-primary', '#F7F8FA');
          html.style.setProperty('--bg-secondary', '#FFFFFF');
          html.style.setProperty('--text-primary', '#172B4D');
          html.style.setProperty('--text-secondary', '#626F86');
          html.style.setProperty('--border', '#DCDFE4');
        }
      }

      applyTheme(theme);
    })();
  </script>

  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .login-page {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .login-box {
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .login-box h1 {
      text-align: center;
      color: #667eea;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      padding: 12px 16px;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      font-size: 13px;
    }

    .error-message.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .login-form {
      display: block;
    }

    .login-form.hidden {
      display: none;
    }
  </style>
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-box">
      <h1>⚡ FastERP</h1>

      <div id="error" class="error-message"></div>

      <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" placeholder="admin" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">Ingresar</button>
      </form>

      <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: #666;">Validando credenciales...</p>
      </div>
    </div>
  </div>

  <script src="/static/js/theme.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');
      const errorDiv = document.getElementById('error');
      const loadingDiv = document.getElementById('loading');
      const loginForm = document.getElementById('loginForm');

      // Limpiar errores
      errorDiv.classList.remove('show');

      // Mostrar loading
      loginForm.classList.add('hidden');
      loadingDiv.style.display = 'block';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            username: username,
            password: password,
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Login failed');
        }

        // Guardar en localStorage
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('refresh_token', data.refresh_token);
        localStorage.setItem('user_id', data.user_id);
        localStorage.setItem('user_name', username);
        localStorage.setItem('user_email', username + '@fastherp.com');
        localStorage.setItem('tenant_id', 'default-123');

        // Redirigir al dashboard
        console.log('Login exitoso, redirigiendo...');
        window.location.href = '/admin';

      } catch (error) {
        // Mostrar error
        loginForm.classList.remove('hidden');
        loadingDiv.style.display = 'none';
        submitBtn.disabled = false;

        errorDiv.textContent = error.message;
        errorDiv.classList.add('show');

        console.error('Login error:', error);
      }
    }
  </script>
</body>
</html>
