<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastERP Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .tagline {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .help-text {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .progress {
            margin-bottom: 30px;
        }

        .step {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .step-number {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }

        .step-label {
            margin-left: 10px;
            color: #333;
            font-size: 13px;
            font-weight: 500;
        }

        .required {
            color: #dc3545;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            text-align: center;
            display: none;
        }

        .success-icon {
            width: 60px;
            height: 60px;
            background: #d4edda;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 30px;
        }

        .success-title {
            font-size: 20px;
            color: #155724;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .success-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">⚡ FastERP</div>
            <div class="tagline">Multi-tenant ERP</div>
        </div>

        <div id="setupForm">
            <h1>Initial Setup</h1>
            <p class="subtitle">Configure your FastERP system</p>

            <div id="alert" class="alert"></div>

            <form id="form">
                <!-- Organization -->
                <div class="form-group">
                    <label for="tenant_name">
                        Organization Name <span class="required">*</span>
                    </label>
                    <input
                        type="text"
                        id="tenant_name"
                        name="tenant_name"
                        placeholder="e.g., Acme Corp"
                        required
                    >
                    <div class="help-text">Your company or organization name</div>
                </div>

                <!-- Slug -->
                <div class="form-group">
                    <label for="tenant_slug">
                        Subdomain/Slug <span class="required">*</span>
                    </label>
                    <input
                        type="text"
                        id="tenant_slug"
                        name="tenant_slug"
                        placeholder="e.g., acme-corp"
                        required
                    >
                    <div class="help-text">Lowercase, no spaces or special characters</div>
                </div>

                <!-- Admin User -->
                <div class="form-group">
                    <label for="admin_user">
                        Admin Username <span class="required">*</span>
                    </label>
                    <input
                        type="text"
                        id="admin_user"
                        name="admin_user"
                        placeholder="e.g., admin"
                        required
                    >
                    <div class="help-text">Your admin account username</div>
                </div>

                <!-- Admin Email -->
                <div class="form-group">
                    <label for="admin_email">
                        Admin Email <span class="required">*</span>
                    </label>
                    <input
                        type="email"
                        id="admin_email"
                        name="admin_email"
                        placeholder="e.g., admin@acme.com"
                        required
                    >
                </div>

                <!-- Passwords -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">
                            Password <span class="required">*</span>
                        </label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="At least 8 characters"
                            required
                            minlength="8"
                        >
                    </div>
                    <div class="form-group">
                        <label for="confirm">
                            Confirm <span class="required">*</span>
                        </label>
                        <input
                            type="password"
                            id="confirm"
                            name="confirm"
                            placeholder="Repeat password"
                            required
                            minlength="8"
                        >
                    </div>
                </div>

                <!-- Buttons -->
                <div class="button-group">
                    <button type="submit" class="btn-primary" id="submitBtn">
                        Create Setup
                    </button>
                </div>
            </form>
        </div>

        <div id="loadingView" class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #666;">Creating your system...</p>
        </div>

        <div id="successView" class="success-message">
            <div class="success-icon">✓</div>
            <div class="success-title">Setup Complete!</div>
            <div class="success-text" id="successMessage"></div>
            <button type="button" class="btn-primary" id="goToLoginBtn" style="width: 100%;">
                Go to Login
            </button>
        </div>
    </div>

    <script nonce="{{.Nonce}}">
        const form = document.getElementById('form');
        const tenantName = document.getElementById('tenant_name');
        const tenantSlug = document.getElementById('tenant_slug');
        const alertDiv = document.getElementById('alert');

        // Auto-generate slug from tenant name
        tenantName.addEventListener('input', function() {
            const slug = this.value
                .toLowerCase()
                .replace(/\s+/g, '-')
                .replace(/[^\w\-]/g, '');
            tenantSlug.value = slug;
        });

        form.addEventListener('submit', handleSubmit);

        document.getElementById('goToLoginBtn').addEventListener('click', () => {
            window.location.href = '/login';
        });

        function showAlert(message, type) {
            alertDiv.textContent = message;
            alertDiv.className = `alert show alert-${type}`;
        }

        function hideAlert() {
            alertDiv.className = 'alert';
        }

        async function handleSubmit(e) {
            e.preventDefault();
            hideAlert();

            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;

            if (password !== confirm) {
                showAlert('Passwords do not match', 'error');
                return;
            }

            if (password.length < 8) {
                showAlert('Password must be at least 8 characters', 'error');
                return;
            }

            // Show loading
            document.getElementById('setupForm').style.display = 'none';
            document.getElementById('loadingView').style.display = 'block';

            try {
                const response = await fetch('/api/setup/initial', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        tenant_name: document.getElementById('tenant_name').value,
                        tenant_slug: document.getElementById('tenant_slug').value,
                        admin_user: document.getElementById('admin_user').value,
                        admin_email: document.getElementById('admin_email').value,
                        password: password,
                        confirm: confirm,
                    }),
                });

                const data = await response.json();

                if (response.ok) {
                    // Success
                    document.getElementById('loadingView').style.display = 'none';
                    document.getElementById('successView').style.display = 'block';
                    document.getElementById('successMessage').textContent = data.message;

                    // Redirect after 3 seconds
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 3000);
                } else {
                    throw new Error(data.error || 'Setup failed');
                }
            } catch (error) {
                document.getElementById('loadingView').style.display = 'none';
                document.getElementById('setupForm').style.display = 'block';
                showAlert(error.message || 'An error occurred', 'error');
            }
        }
    </script>
</body>
</html>
