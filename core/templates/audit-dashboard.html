<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-primary">
    <div class="container">
        <div class="header">
            <h1>🔍 Audit Dashboard</h1>
            <p>System activity & compliance logs</p>
        </div>

        <!-- Stats Row -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" hx-get="/api/audit/stats?days=30" hx-trigger="load" hx-swap="innerHTML">
                    <span class="spinner"></span>
                </div>
                <div class="stat-label">Total Events (30d)</div>
            </div>

            <div class="stat-card">
                <div class="stat-value" hx-get="/api/audit/stats?days=7" hx-trigger="load" hx-swap="innerHTML">
                    <span class="spinner"></span>
                </div>
                <div class="stat-label">This Week</div>
            </div>

            <div class="stat-card">
                <div class="stat-value" hx-get="/api/audit/stats?days=1" hx-trigger="load" hx-swap="innerHTML">
                    <span class="spinner"></span>
                </div>
                <div class="stat-label">Today</div>
            </div>

            <div class="stat-card">
                <div class="stat-value" id="error-count">-</div>
                <div class="stat-label">Errors (7d)</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" hx-get="/audit/entity-list" hx-target="#tab-content" hx-swap="innerHTML">
                Entity History
            </button>
            <button class="tab-btn" hx-get="/audit/user-activity" hx-target="#tab-content" hx-swap="innerHTML">
                User Activity
            </button>
            <button class="tab-btn" hx-get="/audit/export-form" hx-target="#tab-content" hx-swap="innerHTML">
                Export
            </button>
        </div>

        <!-- Tab Content -->
        <div id="tab-content" class="tab-content">
            <div class="form-group">
                <label>Search Entity ID:</label>
                <input type="text" id="entity-search" placeholder="e.g., contact-123" class="input">
                <button class="btn" hx-get="/api/audit/entity"
                        hx-include="#entity-search"
                        hx-target="#audit-results"
                        hx-swap="innerHTML">
                    Search
                </button>
            </div>

            <div id="audit-results" class="audit-table">
                <p>Enter an entity ID to view its audit trail</p>
            </div>
        </div>

        <!-- Export Section -->
        <div class="export-section">
            <h3>📥 Export Audit Logs</h3>
            <form hx-get="/api/audit/export" hx-target="#export-results" hx-swap="innerHTML">
                <div class="form-row">
                    <div class="form-group">
                        <label>Start Date:</label>
                        <input type="date" name="start" class="input">
                    </div>
                    <div class="form-group">
                        <label>End Date:</label>
                        <input type="date" name="end" class="input">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Export JSON</button>
            </form>
            <div id="export-results"></div>
        </div>
    </div>

    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            color: var(--text-primary);
        }

        .header p {
            margin: 5px 0 0 0;
            color: var(--text-secondary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            transition: all 0.3s;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background: var(--primary);
        }

        .audit-table {
            overflow-x: auto;
        }

        .audit-table table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .audit-table th {
            background: var(--bg-primary);
            padding: 12px;
            text-align: left;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border);
        }

        .audit-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }

        .audit-table tr:hover {
            background: var(--bg-primary);
        }

        .status-success {
            color: #10b981;
            font-weight: bold;
        }

        .status-error {
            color: #ef4444;
            font-weight: bold;
        }

        .action-create { color: #10b981; }
        .action-update { color: #3b82f6; }
        .action-delete { color: #ef4444; }
        .action-read { color: #8b5cf6; }

        .export-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .export-section h3 {
            margin-top: 0;
            color: var(--text-primary);
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }
    </style>

    <script src="/static/js/app.js"></script>
    <script>
        document.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target.id === 'tab-content') {
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                evt.detail.xhr.target.classList.add('active');
            }
        });
    </script>
</body>
</html>
