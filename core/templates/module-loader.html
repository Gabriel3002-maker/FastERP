<!-- Module Container -->
<div class="module-container" id="moduleContainer">
    <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
        <div style="font-size: 32px; margin-bottom: 20px;">⏳</div>
        <p>Cargando {{.ModuleName}}...</p>
    </div>
</div>

<script>
(() => {
    const moduleName = '{{.ModuleName}}';
    const moduleDir = `/modules/${moduleName}/frontend`;
    const container = document.getElementById('moduleContainer');

    const addStyle = (href) => {
        if (document.querySelector(`link[href="${href}"]`)) return;
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        document.head.appendChild(link);
    };

    // Los <script> insertados con innerHTML no se ejecutan, así que el loader
    // los carga a mano y en orden: primero el motor de vistas del core, después
    // el JS del módulo, que puede depender de él.
    const addScript = (src) => new Promise((resolve) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = () => resolve(); // un módulo sin app.js es válido
        document.body.appendChild(script);
    });

    fetch(`${moduleDir}/index.html`)
        .then((r) => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.text();
        })
        .then(async (html) => {
            container.innerHTML = html;

            // Infraestructura del core, disponible para todos los módulos.
            addStyle('/static/css/fast-views.css');
            addStyle(`${moduleDir}/styles.css`);

            await addScript('/static/js/fast-views.js');
            await addScript(`${moduleDir}/app.js`);
            console.log(`Módulo ${moduleName} cargado`);
        })
        .catch((err) => {
            container.innerHTML = `
                <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                    <div style="font-size: 32px; margin-bottom: 20px;">❌</div>
                    <p>Error cargando módulo: ${err.message}</p>
                </div>`;
        });
})();
</script>

<style>
.module-container {
    min-height: 500px;
}
</style>
