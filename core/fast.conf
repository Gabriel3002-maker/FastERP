[server]
# Puerto del servidor FastERP
port = 7071
host = 0.0.0.0

[database]
# Conexión PostgreSQL
host = localhost
port = 5432
user = odoo17
password = odoo17
name = fasterp

[modules]
# Directorio de módulos
path = ../modules

[logging]
# Nivel de logging: debug, info, warning, error
level = info

[environment]
# Entorno: development, production
env = development

[security]
# JWT Secret (cambiar en producción)
jwt_secret = change-me-in-production
jwt_refresh_secret = change-me-in-production-refresh

[features]
# Features habilitadas
enable_modules = true
enable_api = true
