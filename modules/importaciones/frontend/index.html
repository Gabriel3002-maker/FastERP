<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Importaciones</title>
  <link rel="stylesheet" href="/static/css/fast-views.css">
</head>
<body>
  <div class="ft-module">
    <div class="ft-header">
      <h1>🚢 Importaciones</h1>
      <p>Importás mercadería y repartís flete, aduana y seguro sobre cada producto para calcular su costo real (landed cost).</p>
    </div>

    <div class="ft-guide" data-fast-guide="importaciones">
      <span>Creá una importación con sus gastos (flete, aduana, seguro). El sistema calcula el costo real de cada producto. Al recibir, el stock sube con ese costo.</span>
    </div>

    <div data-fast-view data-model="importaciones/import_order"></div>
  </div>

  <script src="/static/js/fast-views.js"></script>
</body>
</html>
