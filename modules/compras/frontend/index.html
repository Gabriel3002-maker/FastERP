<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compras</title>
  <link rel="stylesheet" href="/static/css/fast-views.css">
</head>
<body>
  <div class="ft-module">
    <div class="ft-header">
      <h1>📥 Compras</h1>
      <p>Pedís mercadería a tus proveedores. Al recibirla, el stock sube solo en Operaciones.</p>
    </div>

    <div class="ft-guide" data-fast-guide="compras">
      <span>Creá una compra, elegí el <strong>proveedor</strong> y agregá productos con su costo. Cuando llega la mercadería apretá <strong>Recibir</strong> y el inventario se actualiza solo.</span>
    </div>

    <div data-fast-view data-model="compras/purchase"></div>
  </div>

  <script src="/static/js/fast-views.js"></script>
</body>
</html>
