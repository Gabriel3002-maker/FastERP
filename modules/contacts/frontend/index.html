<div class="contacts-module">
    <div class="module-header">
        <h1>👥 Contactos</h1>
    </div>

    <!-- Toda la tabla, paginación, búsqueda global y búsqueda por columna las
         resuelve el core leyendo modules/contacts/manifest.json. Este módulo
         no declara columnas ni escribe UI de listado. -->
    <div data-fast-view data-model="contacts/contact"></div>

    <!-- Modal propio: temporal, hasta que el core genere el formulario desde
         el manifest. Hoy expone 5 de los 19 campos declarados. -->
    <div id="contactModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nuevo Contacto</h2>
                <button class="btn-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="contactForm">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="formName" required />
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="formEmail" />
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="tel" id="formPhone" />
                    </div>
                    <div class="form-group">
                        <label>Empresa</label>
                        <input type="text" id="formCompany" />
                    </div>
                    <div class="form-group">
                        <label>Cargo</label>
                        <input type="text" id="formJobTitle" />
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
                <button class="btn-primary" onclick="saveContact()">Guardar</button>
            </div>
        </div>
    </div>
</div>
